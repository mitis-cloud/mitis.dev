<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Newsreader';
        font-weight: 200 800;
        src: url('../public/fonts/newsreader-latin-opsz-normal.woff2') format('woff2-variations');
      }
      @font-face {
        font-family: 'Geist';
        font-weight: 100 900;
        src: url('../public/fonts/geist-latin-wght-normal.woff2') format('woff2-variations');
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        color: #f3f4f2;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 60px 72px 56px;
        font-family: 'Geist', sans-serif;
        background:
          linear-gradient(90deg, rgb(14 24 32 / 0.96) 20%, rgb(14 24 32 / 0.8) 55%, rgb(14 24 32 / 0.25) 100%),
          url('../public/img/macchina-1200.webp') 60% 50% / cover;
      }
      .wordmark {
        font-size: 44px;
        font-weight: 700;
        letter-spacing: -0.04em;
      }
      .cursor {
        display: inline-block;
        width: 0.13em;
        height: 0.8em;
        background: #ff7a1a;
        margin-left: 0.1em;
        vertical-align: -0.07em;
      }
      h1 {
        font-family: 'Newsreader', serif;
        font-size: 62px;
        font-weight: 450;
        letter-spacing: -0.022em;
        line-height: 1.03;
      }
      h1 span {
        display: block;
      }
      .sotto {
        font-size: 24px;
        font-weight: 500;
        color: rgb(243 244 242 / 0.9);
      }
    </style>
  </head>
  <body>
    <div class="wordmark">mitis<span class="cursor"></span></div>
    <h1><span id="a"></span><span id="b"></span><span id="c"></span></h1>
    <div class="sotto" id="s"></div>
  </body>
</html>
