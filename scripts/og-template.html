<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Schibsted Grotesk';
        font-weight: 800;
        src: url('../public/fonts/schibsted-grotesk-v7-latin-800.woff2') format('woff2');
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-weight: 400;
        src: url('../public/fonts/jetbrains-mono-v24-latin-regular.woff2') format('woff2');
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-weight: 700;
        src: url('../public/fonts/jetbrains-mono-v24-latin-700.woff2') format('woff2');
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        background: #0d120f;
        color: #f2f1ec;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 80px 64px;
        font-family: 'Schibsted Grotesk', sans-serif;
      }
      .top {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
      }
      .wordmark {
        font-size: 58px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .cursor {
        display: inline-block;
        width: 0.14em;
        height: 0.78em;
        background: #53c287;
        margin-left: 0.08em;
      }
      .tag {
        font-family: 'JetBrains Mono', monospace;
        font-size: 22px;
        letter-spacing: 0.08em;
        color: rgba(242, 241, 236, 0.6);
      }
      h1 {
        font-size: 88px;
        font-weight: 800;
        letter-spacing: -0.025em;
        line-height: 1.05;
        max-width: 20ch;
      }
      .bar {
        background: #090d0b;
        border: 1px solid rgba(242, 241, 236, 0.14);
        border-radius: 14px;
        box-shadow: 0 0 60px rgba(83, 194, 135, 0.12);
        padding: 26px 36px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-family: 'JetBrains Mono', monospace;
        font-size: 26px;
      }
      .probe {
        color: rgba(242, 241, 236, 0.72);
      }
      .probe strong {
        color: #f2f1ec;
        font-weight: 700;
      }
      .ok {
        color: #53c287;
      }
      .site {
        color: rgba(242, 241, 236, 0.55);
      }
    </style>
  </head>
  <body>
    <div class="top">
      <div class="wordmark">mitis<span class="cursor"></span></div>
      <div class="tag">consulenza cloud &amp; devops</div>
    </div>
    <h1>Infrastruttura cloud noiosa. E&nbsp;che costa la&nbsp;metà.</h1>
    <div class="bar">
      <div class="probe"><span class="ok">probe:</span> <strong>764 requests, 1 failed</strong></div>
      <div class="site">mitis.dev</div>
    </div>
  </body>
</html>
